version: 1
requirements:
  - id: SZ-FUN-001
    priority: must
    text: "The system shall provide user and administrator dashboards for signing activity and appliance health."
  - id: SZ-FUN-002
    priority: must
    text: "Signing requests shall follow an explicit server-side state machine."
  - id: SZ-SEC-001
    priority: must
    text: "Production private signing keys shall remain non-exportable except encrypted DKEK-wrapped backup where supported and explicitly configured."
  - id: SZ-SEC-002
    priority: must
    text: "The Next.js web process shall run unprivileged and shall not execute arbitrary OS commands or access HSM device nodes directly."
  - id: SZ-SEC-003
    priority: must
    text: "No generic remote shell, command execution API, or raw network HSM/PKCS#11 interface shall be exposed."
  - id: SZ-SEC-004
    priority: must
    text: "Security-sensitive operations shall fail closed and require explicit authorization."
  - id: SZ-SEC-005
    priority: must
    text: "Secrets shall never be stored in logs, audit payloads, command-line arguments, URLs, browser storage, source control, or telemetry."
  - id: SZ-HSM-001
    priority: must
    text: "Nitrokey HSM 2 shall be supported through OpenSC/PCSC/PKCS#11 on Debian 13."
  - id: SZ-HSM-002
    priority: must
    text: "The system shall support a designated primary and secondary/DR Nitrokey HSM 2."
  - id: SZ-HSM-003
    priority: must
    text: "DKEK shall be configured before exportable production keys are generated."
  - id: SZ-HSM-004
    priority: must
    text: "DKEK share ceremonies, wrapped-key export/import, and DR restore verification shall be supported without persisting plaintext shares."
  - id: SZ-HSM-005
    priority: must
    text: "HSM devices shall be identified by stable identity/serial rather than enumeration order."
  - id: SZ-AUTH-001
    priority: must
    text: "Local production users shall use password+TOTP or passkey; password-only login is prohibited."
  - id: SZ-AUTH-002
    priority: must
    text: "Microsoft Entra ID OIDC login shall be supported using stable tenant+subject identities."
  - id: SZ-AUTH-003
    priority: must
    text: "Sensitive actions shall require recent step-up authentication."
  - id: SZ-AUTH-004
    priority: must
    text: "CI automation shall prefer workload OIDC, then mTLS, then narrowly scoped service credentials."
  - id: SZ-API-001
    priority: must
    text: "A versioned REST API with OpenAPI documentation shall support signing request submission, approval state, retrieval and verification."
  - id: SZ-API-002
    priority: must
    text: "API signing requests shall bind repository/ref/build identity, artifact digest, profile and requester identity."
  - id: SZ-API-003
    priority: must
    text: "The optional remote PKCS#11 compatibility client shall be policy constrained and shall not expose arbitrary HSM mechanisms or objects."
  - id: SZ-API-004
    priority: must
    text: "REST mutating operations shall support idempotency keys where replay could duplicate effects."
  - id: SZ-PWA-001
    priority: must
    text: "The web app shall be installable as a PWA and support Web Push signing approval notifications."
  - id: SZ-PWA-002
    priority: must
    text: "Push notifications alone shall never authorize signing; approval shall use a transaction-bound challenge code and/or WebAuthn step-up."
  - id: SZ-PWA-003
    priority: must
    text: "Approval UI shall show artifact name/digest suffix, requester, repository/ref, signing profile and expiry before acceptance."
  - id: SZ-AUD-001
    priority: must
    text: "Security and signing actions shall create canonical append-only audit events with tamper-evident chaining/checkpoints."
  - id: SZ-AUD-002
    priority: must
    text: "Audit events shall be exportable and optionally forwarded to remote syslog/SIEM."
  - id: SZ-OS-001
    priority: must
    text: "A privileged Rust OS daemon shall expose only typed allowlisted appliance operations over a Unix socket."
  - id: SZ-OS-002
    priority: must
    text: "Network/firewall management changes shall be transactional with automatic rollback unless confirmed."
  - id: SZ-OS-003
    priority: must
    text: "SSH shall be disabled by default and normal administration shall be possible from structured web controls."
  - id: SZ-OS-004
    priority: must
    text: "A persistent fullscreen local DCUI shall run on tty1."
  - id: SZ-OS-005
    priority: must
    text: "Local maintenance console access shall require a separate physical-console maintenance credential with rate limiting and auto-relock."
  - id: SZ-INS-001
    priority: must
    text: "A root-run install.sh shall bootstrap a supported Debian 13 host from a git checkout."
  - id: SZ-INS-002
    priority: must
    text: "Installation shall compile Next.js standalone output and Rust services, configure PostgreSQL/nginx/systemd and start one-time setup mode."
  - id: SZ-INS-003
    priority: must
    text: "Setup mode shall use HTTPS, a cryptographically random one-time token, and become unavailable after initialization."
  - id: SZ-INS-004
    priority: must
    text: "Installer and upgrade actions shall be idempotent where practical and shall not disable TLS verification."
  - id: SZ-DOC-001
    priority: must
    text: "The repository shall document REST signing from Linux, Windows and CI systems."
  - id: SZ-DOC-002
    priority: must
    text: "The repository shall document local OpenSSL 3/PKCS#11/osslsigncode signing without placing HSM PINs in commands or URIs."
  - id: SZ-DOC-003
    priority: must
    text: "The repository shall document DigiCert and Sectigo code-signing enrollment/import procedures and link to current official provider documentation."
