server {
  listen 443 ssl http2;
  server_name _;
  ssl_certificate /etc/signzone/tls/server.crt;
  ssl_certificate_key /etc/signzone/tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 256m;
  location / { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
